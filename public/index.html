<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TechNova Solutions</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f4f6f9;
            max-width: 700px;
            margin: 40px auto;
            padding: 0 16px;
        }

        h1 {
            color: #232f3e;
        }

        .servicio {
            background: white;
            border-left: 6px solid #ff9900;
            padding: 10px 15px;
            margin-bottom: 10px;
            border-radius: 6px;
        }

        .precio {
            color: #555;
        }

        form {
            display: flex;
            flex-direction: column;
            gap: 8px;
            background: white;
            padding: 15px;
            border-radius: 6px;
        }

        input,
        textarea {
            padding: 8px;
            font-size: 15px;
            border: 1px solid #ccc;
            border-radius: 4px;
        }

        button {
            background: #ff9900;
            color: white;
            border: none;
            padding: 10px;
            font-size: 15px;
            border-radius: 6px;
            cursor: pointer;
        }

        #estado {
            font-weight: bold;
        }

        small {
            color: #777;
        }
    </style>
</head>

<body>
    <h1>TechNova Solutions</h1>
    <small id="origen"></small>

    <h2>Nuestros servicios</h2>
    <div id="servicios">Cargando...</div>

    <h2>Contacto</h2>
    <form id="formulario">
        <input id="nombre" placeholder="Nombre" />
        <input id="email" placeholder="Email" />
        <textarea id="mensaje" rows="4" placeholder="Mensaje"></textarea>
        <button type="submit">Enviar</button>
        <p id="estado"></p>
    </form>

    <script>
        async function cargarServicios() {
            const respuesta = await fetch("/api/servicios");
            const datos = await respuesta.json();
            document.getElementById("origen").textContent = `Datos servidos por: ${datos.servidor}`;
            const contenedor = document.getElementById("servicios");
            contenedor.innerHTML = "";
            datos.servicios.forEach((servicio) => {
                const div = document.createElement("div");
                div.className = "servicio";
                const titulo = document.createElement("strong");
                titulo.textContent = servicio.nombre;
                const texto = document.createElement("p");
                texto.textContent = servicio.descripcion;
                const precio = document.createElement("span");
                precio.className = "precio";
                precio.textContent = `Desde ${servicio.precio} €`;
                div.append(titulo, texto, precio);
                contenedor.appendChild(div);
            });
        }

        document.getElementById("formulario").addEventListener("submit", async (evento) => {
            evento.preventDefault();
            const respuesta = await fetch("/api/contacto", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify({
                    nombre: document.getElementById("nombre").value,
                    email: document.getElementById("email").value,
                    mensaje: document.getElementById("mensaje").value,
                }),
            });
            const datos = await respuesta.json();
            const estado = document.getElementById("estado");
            if (respuesta.ok) {
                estado.textContent = `Mensaje n.º ${datos.id} guardado por ${datos.guardadoPor}`;
                evento.target.reset();
            } else {
                estado.textContent = datos.error;
            }
        });

        cargarServicios();
    </script>
</body>

</html>
